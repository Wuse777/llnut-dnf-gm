name: publish-client-assets-041
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-client-assets-041.yml']
permissions:
  contents: write
concurrency:
  group: publish-client-assets-041
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed source patch and verify exact tree
        run: |
          test "$(git rev-parse HEAD^)" = "269b23ef4a26a4c72c2fada1f09c638fede93de1"
          python - <<'PY'
          import base64,hashlib,zlib,subprocess
          patch=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='79de628f3800a74780ddcf0a5b3f8bd5a91dfb0e60be162ddb64d1c8c15ea471'
          subprocess.run(['git','apply','--index','--whitespace=nowarn','-'],input=patch,check=True)
          PY
          git rm .github/workflows/publish-client-assets-041.yml
          test "$(git write-tree)" = "d8a38e5b5cec99d017d2dcd1226a80e5e9c3b01e"
      - name: Focused image and UI verification
        run: |
          python -m pip install -r requirements.lock
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_game_assets.py tests/test_dxt_assets.py tests/test_portrait_pack.py
          python tools/check_documentation.py
          bash -n tools/publish_github_release.sh
          npm --prefix web ci
          npm --prefix web test -- src/components/AssetCoverage.test.ts src/components/GameImage.test.ts
      - name: Publish fixed source commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name='Wuse777' -c user.email='35197091+Wuse777@users.noreply.github.com' commit -m 'feat: integrate private client icons and coverage previews [skip ci]'
          git tag v0.4.1
          git push origin HEAD:refs/heads/main refs/tags/v0.4.1
          bash tools/publish_github_release.sh v0.4.1
