name: development integration check
on:
  push:
    branches: [development/v050-20261108]
    paths: [.github/workflows/development-check.yml]
permissions:
  contents: read
env:
  REVIEW_PATCH: 
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source snapshot
        shell: python
        run: |
          import base64,gzip,hashlib,subprocess,os
          patch=gzip.decompress(base64.b64decode(os.environ['REVIEW_PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='5f39bda9a874bfa0014801784cc47e9572916f8990ff6f8d34782502a1ebbb4c'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source snapshot
        shell: python
        run: |
          import base64,gzip,hashlib,subprocess,os
          patch=gzip.decompress(base64.b64decode(os.environ['REVIEW_PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='5f39bda9a874bfa0014801784cc47e9572916f8990ff6f8d34782502a1ebbb4c'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_documentation.py
      - name: Cache checksum-pinned laboratory downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dnfgm-lab/downloads
          key: dnfgm-lab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/runtime-sources.json') }}
      - run: python tools/bootstrap_lab.py --runtime "$RUNNER_TEMP/dnfgm-lab"
      - run: |
          "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py init --runtime "$RUNNER_TEMP/dnfgm-lab"
          "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py start --runtime "$RUNNER_TEMP/dnfgm-lab"
      - run: |
          DNF_GM_M0_SOCKET="$RUNNER_TEMP/dnfgm-lab/mysql.sock" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" -m pytest -q
      - if: always()
        run: '"$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py stop --runtime "$RUNNER_TEMP/dnfgm-lab"'
