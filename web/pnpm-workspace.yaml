packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  typescript: npm:typescript-native-bridge@6.0.3-bridge.18.tsgo.7.0.2
overrides:
  vite: 'catalog:'
  typescript: 'catalog:'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.541'

patchedDependencies:
  css-render@0.15.14: patches/css-render@0.15.14.patch
