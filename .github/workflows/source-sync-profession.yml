name: Publish reviewed profession maintenance source
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-profession.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and fast-forward public source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=f9fdd0650d1b4232c860a3dc2a836d3e681d2fbd
          target=15baedefc6b81292277918b0b312b6bc61d75b22
          curl --fail --silent --show-error --insecure --max-time 90 'https://123.57.161.14/dnf-gm/assets/source-sync-33e589d952cd47108aaed8f5cb9fae58.bundle' -o "$RUNNER_TEMP/source.bundle"
          echo "2fe1f66924c253790aaac3c5dec2510f0462aee86e9854c4c5cb44b6ecbfaa4e  $RUNNER_TEMP/source.bundle" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source-repo"
          cd "$RUNNER_TEMP/source-repo"
          git init -q
          git remote add origin https://github.com/Wuse777/llnut-dnf-gm.git
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          git fetch "$RUNNER_TEMP/source.bundle" refs/heads/main:refs/heads/reviewed
          test "$(git rev-parse reviewed)" = "$target"
          git merge-base --is-ancestor "$base" "$target"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$target:refs/heads/main"
