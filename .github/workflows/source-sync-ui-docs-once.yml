name: One-time verified UI documentation source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-ui-docs-once.yml]
permissions:
  contents: write
concurrency:
  group: dnf-gm-source-main-sync
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation bundle and fast-forward main (no tests or game assets)
        shell: bash
        env:
          BASE: 60fac2a1193d0595bc3f69a0024e9be91821d27c
          TARGET: dfc539d0130a59f1ef2561cd3fb9721f41574fd3
          BUNDLE_SHA: faff5335cacbeacd3534b4dcb2fd3874511e7e7332c7b575ca3eb5e1da1bb93f
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          curl --fail --silent --show-error --insecure --connect-timeout 20 --max-time 90 --retry 2 'https://123.57.161.14/dnf-gm/assets/source-sync-a118893fb6494f11a136df5f39e1e071.bundle' -o /tmp/source.bundle
          echo "$BUNDLE_SHA  /tmp/source.bundle" | sha256sum --check --strict
          git bundle verify /tmp/source.bundle
          git fetch /tmp/source.bundle refs/heads/main:refs/remotes/verified-source/main
          test "$(git rev-parse refs/remotes/verified-source/main)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          git push origin "$TARGET:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET"
          rm -f /tmp/source.bundle
