name: publish-v050
on:
  push:
    branches: [development/v050-20261108]
    paths: ['.github/workflows/development-check.yml']
permissions:
  contents: write
concurrency:
  group: publish-v050
  cancel-in-progress: false
env:
  REVIEW_PATCH_0: 
  REVIEW_PATCH_1: 
  REVIEW_PATCH_2: 
  REVIEW_PATCH_3: 
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '414e590d90b416f5cf5ac56f75fb2c08f9d2dc8d'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore reviewed source commit and exact tree
        run: |
          test "$(git rev-parse HEAD)" = "414e590d90b416f5cf5ac56f75fb2c08f9d2dc8d"
          python - <<'PY'
          import os,gzip,base64,hashlib,subprocess
          patch=gzip.decompress(base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('REVIEW_PATCH_'))))
          assert hashlib.sha256(patch).hexdigest()=='7f41532ed1d26e33d43adbcb578a34394f8afc9c47a76e6310f635351ad7e578'
          subprocess.run(['git','apply','--index','--whitespace=nowarn','-'],input=patch,check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='e421de02c93c8c273ffd156b1d8e8a0c4237bc2a'
          commit=base64.b64decode('')
          assert subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=commit).decode().strip()=='1884f4d9ad7629d8a072b825b0775556fb72cab9'
          PY
          git checkout --detach 1884f4d9ad7629d8a072b825b0775556fb72cab9
          python tools/check_documentation.py
          bash -n tools/publish_github_release.sh
      - name: Push reviewed source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "414e590d90b416f5cf5ac56f75fb2c08f9d2dc8d"
          git tag v0.5.0 1884f4d9ad7629d8a072b825b0775556fb72cab9
          git push origin 1884f4d9ad7629d8a072b825b0775556fb72cab9:refs/heads/main refs/tags/v0.5.0
          bash tools/publish_github_release.sh v0.5.0
