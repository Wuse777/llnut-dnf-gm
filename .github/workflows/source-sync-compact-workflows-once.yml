name: One-time verified compact-workflow source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-compact-workflows-once.yml]
permissions:
  contents: write
concurrency:
  group: dnf-gm-source-main-sync
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source bundle and fast-forward main (no tests or game assets)
        shell: bash
        env:
          BASE: dfc539d0130a59f1ef2561cd3fb9721f41574fd3
          TARGET: acc364d67e13c02a02656946b7c36c9398637887
          BUNDLE_SHA: ff5d8d46808563df73618ae9677d2fbeab64cbc55fe6c20143b6919f4bef3386
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          curl --fail --silent --show-error --insecure --connect-timeout 20 --max-time 90 --retry 2 'https://123.57.161.14/dnf-gm/assets/source-sync-39afe4d4b7a647ecbde6b6562421a8a4.bundle' -o /tmp/source.bundle
          echo "$BUNDLE_SHA  /tmp/source.bundle" | sha256sum --check --strict
          git bundle verify /tmp/source.bundle
          git fetch /tmp/source.bundle refs/heads/main:refs/remotes/verified-source/main
          test "$(git rev-parse refs/remotes/verified-source/main)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          git push origin "$TARGET:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET"
          rm -f /tmp/source.bundle
