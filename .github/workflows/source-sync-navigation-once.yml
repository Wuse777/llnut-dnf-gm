name: One-time verified navigation source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-navigation-once.yml]
permissions:
  contents: write
concurrency:
  group: dnf-gm-source-main-sync
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source bundle and fast-forward main (no tests or game assets)
        shell: bash
        env:
          BASE: 15baedefc6b81292277918b0b312b6bc61d75b22
          TARGET: 0c297eaa564a848ba7c315bebd9a14c57006b41c
          BUNDLE_SHA: 28effea68b4f4b7be96003214494381d3de67acfcea7702ef13feeb7c2f1dd82
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          curl --fail --silent --show-error --insecure --connect-timeout 20 --max-time 90 --retry 2 'https://123.57.161.14/dnf-gm/assets/source-sync-edc4a88d57584017a8c20931339228be.bundle' -o /tmp/source.bundle
          echo "$BUNDLE_SHA  /tmp/source.bundle" | sha256sum --check --strict
          git bundle verify /tmp/source.bundle
          git fetch /tmp/source.bundle refs/heads/main:refs/remotes/verified-source/main
          test "$(git rev-parse refs/remotes/verified-source/main)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          git push origin "$TARGET:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET"
          rm -f /tmp/source.bundle
