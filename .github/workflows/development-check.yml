name: publish-v050
on:
  push:
    branches: [development/v050-20261108]
    paths: ['.github/workflows/development-check.yml']
permissions:
  contents: write
concurrency:
  group: publish-v050
  cancel-in-progress: false
env:
  REVIEW_PATCH_0: 
  REVIEW_PATCH_1: 
  REVIEW_PATCH_2: 
  REVIEW_PATCH_3: 
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'c4e77fa0c854f9ea77a33a2a25067d0d8babe7ee'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore reviewed source commit and exact tree
        run: |
          test "$(git rev-parse HEAD)" = "c4e77fa0c854f9ea77a33a2a25067d0d8babe7ee"
          python - <<'PY'
          import os,gzip,base64,hashlib,subprocess
          patch=gzip.decompress(base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('REVIEW_PATCH_'))))
          assert hashlib.sha256(patch).hexdigest()=='794a3e62e099834abeb2dc46fdea1665c492b76c62e97e9b7719f72fe0e5de77'
          subprocess.run(['git','apply','--index','--whitespace=nowarn','-'],input=patch,check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='e421de02c93c8c273ffd156b1d8e8a0c4237bc2a'
          commit=base64.b64decode('')
          assert subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=commit).decode().strip()=='b57011ad5b937b4f77935c73e1d16308fc75eefd'
          PY
          git checkout --detach b57011ad5b937b4f77935c73e1d16308fc75eefd
          python tools/check_documentation.py
          bash -n tools/publish_github_release.sh
      - name: Push reviewed source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c4e77fa0c854f9ea77a33a2a25067d0d8babe7ee"
          git tag v0.5.0 b57011ad5b937b4f77935c73e1d16308fc75eefd
          git push origin b57011ad5b937b4f77935c73e1d16308fc75eefd:refs/heads/main refs/tags/v0.5.0
          bash tools/publish_github_release.sh v0.5.0
