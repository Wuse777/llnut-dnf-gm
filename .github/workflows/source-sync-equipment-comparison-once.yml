name: One-time verified equipment comparison source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-equipment-comparison-once.yml]
permissions:
  contents: write
concurrency:
  group: dnf-gm-source-main-sync
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source bundle and fast-forward main (no tests or game assets)
        shell: bash
        env:
          BASE: 70cf552d7be5560c6042adc00bc25fd612523081
          TARGET: 60fac2a1193d0595bc3f69a0024e9be91821d27c
          BUNDLE_SHA: a8745318391197e0fc88d816586db4f9cc7d50f380b05ad26172afdedc0442f9
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          curl --fail --silent --show-error --insecure --connect-timeout 20 --max-time 90 --retry 2 'https://123.57.161.14/dnf-gm/assets/source-sync-7838a344f65344e3bba9969a9010a3e0.bundle' -o /tmp/source.bundle
          echo "$BUNDLE_SHA  /tmp/source.bundle" | sha256sum --check --strict
          git bundle verify /tmp/source.bundle
          git fetch /tmp/source.bundle refs/heads/main:refs/remotes/verified-source/main
          test "$(git rev-parse refs/remotes/verified-source/main)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          git push origin "$TARGET:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET"
          rm -f /tmp/source.bundle
