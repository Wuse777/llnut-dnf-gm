name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.10.1'
          package_json_file: web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Validate targeted message bridge
        run: node --test tests/private_message_bridge.test.cjs
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint:check
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted backup laboratory tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y age
          command -v age
          command -v age-keygen
      - name: Validate deployment shell syntax
        run: |
          for script in deploy/*.sh tools/*.sh; do bash -n "$script"; done
      - name: Validate documentation and version agreement
        run: python tools/check_documentation.py
      - name: Cache checksum-pinned laboratory downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dnfgm-lab/downloads
          key: dnfgm-lab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/runtime-sources.json') }}
      - run: python tools/bootstrap_lab.py --runtime "$RUNNER_TEMP/dnfgm-lab"
      - run: |
          "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py init --runtime "$RUNNER_TEMP/dnfgm-lab"
          "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py start --runtime "$RUNNER_TEMP/dnfgm-lab"
      - run: |
          mkdir -p outputs
          DNF_GM_M0_SOCKET="$RUNNER_TEMP/dnfgm-lab/mysql.sock" PYTHONPATH=src PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/dnfgm-lab/venv/bin/python" -m pytest -q --junitxml=outputs/backend-junit.xml
      - name: Preserve integration test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: outputs/backend-junit.xml
          if-no-files-found: ignore
      - if: always()
        run: '"$RUNNER_TEMP/dnfgm-lab/venv/bin/python" tools/local_mysql.py stop --runtime "$RUNNER_TEMP/dnfgm-lab"'
