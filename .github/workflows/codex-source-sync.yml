name: One-time reviewed GM source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/codex-source-sync.yml]
permissions:
  contents: write
concurrency:
  group: reviewed-gm-source-sync-20261106
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Wuse777/llnut-dnf-gm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Verify reviewed bundle and fast-forward main without force
        shell: bash
        env:
          EXPECTED_BASE: 8423754df73f93c26b377db577e5efa790b3a1c7
          EXPECTED_TARGET: 91eb4e98d6b62ba32d9065c8a9703ae2afddea06
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/reviewed-source.bundle"
          curl --fail --silent --show-error --retry 1 --connect-timeout 15 --max-time 90 --proto '=https' 'https://123.57.161.14/dnf-gm/assets/source-sync-ed5d23464bbc2a09d5da44a509bad93c.bundle' -o "$bundle"
          echo "025eabcb03d946917bf25b80ee24f2dbbd999a0a5c5d3a4f193bbcb16c5cf670  $bundle" | sha256sum --check --strict
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/remotes/reviewed-source/main
          test "$(git rev-parse refs/remotes/reviewed-source/main)" = "$EXPECTED_TARGET"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_TARGET"
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" = "$EXPECTED_TARGET" ]; then
            echo 'Reviewed source already synchronized.'
            exit 0
          fi
          test "$current" = "$EXPECTED_BASE"
          git push origin refs/remotes/reviewed-source/main:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_TARGET"
          echo "Source synchronized to $EXPECTED_TARGET" >> "$GITHUB_STEP_SUMMARY"
