name: One-time verified SP TP source sync
on:
  push:
    branches: [codex/source-sync-20261106]
    paths: [.github/workflows/source-sync-once.yml]
permissions:
  contents: write
concurrency:
  group: source-sync-once
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact source bundle and fast-forward main
        shell: bash
        env:
          SOURCE_URL: https://123.57.161.14/dnf-gm/assets/source-sync-c85b56f6719c4a9981a7de1f3fec5db6.bundle
          SOURCE_SHA256: 8da7b3db70e445344e228011c8d83ebf0d2bfb140399013096d16f721a7b31aa
          EXPECTED_BASE: 7cb849b78b631cc258cb444c8314a10c85036575
          EXPECTED_TARGET: 49fefefed0e3df1a1e693c7e149d80fdd6561a0c
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/verified-source.bundle"
          # The public-source payload is authenticated by the pinned SHA-256.
          # No repository credential is sent to the source host.
          curl --insecure --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o "$bundle"
          printf '%s  %s\n' "$SOURCE_SHA256" "$bundle" | sha256sum --check --strict
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/remotes/verified-source/main
          test "$(git rev-parse refs/remotes/verified-source/main)" = "$EXPECTED_TARGET"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_TARGET"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git push origin "$EXPECTED_TARGET:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_TARGET"
